name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt -r requirements-validation.txt

      - name: Lint
        run: ruff check .

      - name: Compile Python modules
        run: python -m compileall -q $(git ls-files "*.py")

      - name: Type check shared modules
        run: mypy --config-file pyproject.toml backtest_statistics.py position_manager.py runtime_utils.py config.py

      - name: Run unit tests with coverage
        run: coverage run -m unittest discover -s tests -p "test_*.py" && coverage report --fail-under=1

      - name: Build Docker image
        run: docker build .
