name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-backtest.txt

      - name: Compile Python modules
        run: python -m py_compile app.py config.py data_client.py indicators.py strategy.py strategy_universe.py binance_strategy_bot.py okx_market_cap_bot.py project_signal_backtest.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build Docker image
        run: docker build .
